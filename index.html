<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>网站公告与备用地址</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      padding: 20px 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
      line-height: 1.8;
      color: #edf0ff;
      background: linear-gradient(145deg, #101426, #252e50);
      overflow-wrap: anywhere;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      padding: 30px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 32px);
    }

    .header p {
      color: #b8c2e0;
      font-size: 14px;
    }

    .card {
      margin-bottom: 16px;
      padding: clamp(16px, 4vw, 26px);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 18px;
      background: rgba(255, 255, 255, .06);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 19px;
    }

    .notice {
      padding: 12px 14px;
      border-left: 3px solid #8da0ff;
      border-radius: 4px 10px 10px 4px;
      background: rgba(141, 160, 255, .1);
      color: #d4dcf7;
      font-size: 14px;
    }

    .link-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 54px;
      margin-top: 12px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
      color: #dce3ff;
      font-size: 15px;
      overflow-wrap: anywhere;
      word-break: break-word;
      transition: background .2s ease;
    }

    .link-button:hover {
      background: rgba(255, 255, 255, .12);
    }

    .primary {
      justify-content: center;
      border: 0;
      background: linear-gradient(100deg, #617cff, #9668ed);
      color: #fff;
      font-weight: 700;
    }

    .primary:hover {
      background: linear-gradient(100deg, #7189ff, #a17afa);
    }

    .muted {
      margin-top: 8px;
      color: #9ba8cb;
      font-size: 13px;
    }

    .footer {
      padding: 20px 8px;
      text-align: center;
      color: #8994b2;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 10px;
        font-size: 15px;
      }

      .header {
        padding: 24px 8px;
      }

      .card {
        border-radius: 15px;
      }

      .card h2 {
        font-size: 17px;
      }

      .link-button {
        min-height: 50px;
        font-size: 14px;
      }
    }

    @media (max-width: 320px) {
      body {
        padding: 8px 6px;
      }

      .card {
        padding: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>华夏凤楼</h1>
    </header>

    <section class="card">
      <h2>📢 最新公告</h2>
      <div class="notice">本页面将为您更新提供 【华夏凤楼】 最新网址，请收藏</div>
    </section>

    <section class="card">
      <h2>🌐 最新地址</h2>

      <a class="link-button primary"
         href="https://huaxia58.top"
         target="_blank"
         rel="noopener noreferrer" style="text-decoration: none;">
        <span>https://huaxia58.top</span>
      </a>

    </section>

    <section class="card">
      <h2>🌐 海外永久地址</h2>

      <a class="link-button primary"
         href="https://huaxiafeng.com"
         target="_blank"
         rel="noopener noreferrer" style="text-decoration: none;">
        <span>https://huaxiafeng.com</span>
      </a>

    </section>

    <section class="card">
      <h2>⭐ 收藏与帮助</h2>
      <p class="muted">
        请收藏本页面，以便日后快速访问。
        请注意核对域名，避免访问仿冒网站。
      </p>
    </section>

    <footer class="footer">
      Copyright © 2026 华夏凤楼
    </footer>
  </main>
</body>
</html>
